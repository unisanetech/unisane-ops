id: unisane-ops.repository-integrity.check
title: Standalone repository changes require integrity and generated-drift proof
description:
  Select the target-local repository shape, zero foreign workspace blockers, exact released UI
  edges, and generated integrity receipt verification.
owner: unisane-ops
scope:
  - unisane-ops
strength: required
appliesTo:
  paths:
    - .gitignore
    - .npmrc
    - package.json
    - apps/**
    - packages/**
    - scripts/check-repository-integrity.mjs
    - tools/repository/standalone-integrity-policy.json
    - docs/reference/generated/repository/standalone-repository-integrity.json
  phases:
    - closure
  risks:
    - standard
    - high-impact
requires:
  actionIds:
    - unisane-ops.repository-integrity.check
  evidence: source-bound-action
