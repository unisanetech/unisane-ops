id: unisane.ops.console-release-boundary-check
title: Ops console UI consumer changes require exact released-package boundary proof
description:
  Select the permanent source, emitted, exact-registry offline consumer, stylesheet, asset, peer,
  and conversion-readiness proof for the Ops console.
owner: unisane-ops
scope:
  - unisane-ops
strength: required
appliesTo:
  paths:
    - .npmrc
    - package.json
    - apps/console/package.json
    - apps/console/src/**
    - apps/console/tsconfig.json
    - apps/console/tsup.browser.config.ts
    - scripts/check-console-release-boundary.mjs
    - scripts/check-console-external-consumer.mjs
    - tests/console-external-consumer.test.mjs
    - tests/console-release-boundary.test.mjs
    - tools/repository/console-release-boundary-policy.json
    - tools/skopos/actions/console-release-boundary-check.yaml
    - tools/skopos/guards/console-release-boundary-check.yaml
  phases:
    - iteration
    - closure
  risks:
    - standard
    - high-impact
requires:
  actionIds:
    - unisane.ops.console-release-boundary-check
  evidence: source-bound-action
