id: unisane.ops.console-release-boundary-check
title: Verify the Ops console UI consumer release boundary
description:
  Inventory the authored and emitted UI/DataTable consumer boundary and preserve exact fail-closed
  conversion blockers.
category: quality-check
scope:
  - unisane-ops
command:
  pnpm check:console-release-boundary && pnpm --filter @unisane/ops-console build && pnpm
  check:console-release-boundary:emitted
cwd: .
inputs:
  - package.json
  - apps/console/package.json
  - apps/console/src
  - apps/console/tsconfig.json
  - apps/console/tsup.browser.config.ts
  - scripts/check-console-release-boundary.mjs
  - tests/console-release-boundary.test.mjs
  - tools/repository/console-release-boundary-policy.json
outputs: []
affects:
  - apps/console/dist
capabilities:
  process: required
  network: none
  browser: none
  tools: [node, pnpm]
  secrets: []
  services: []
effects:
  workspace: declared
  artifacts: none
  external: none
concurrency: exclusive
workspaceMode: overlay-safe
safety: mutating
requiresApproval: false
whenToUse:
  Run when Ops console UI/DataTable source imports, emitted declarations, CSS/assets, package
  requirements, or release-boundary policy changes.
phases:
  - iteration
  - closure
risks:
  - standard
  - high-impact
recommendedAfter: []
owner: unisane-ops
