name: Publish private Ops canary
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter publish-private-next
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ops-private-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-private-next'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-package-contents.mjs
      - run:
          pnpm exec turbo run build --filter=@unisane/ops... --filter=@unisane/provider-aws
          --filter=@unisane/provider-google --filter=@unisane/provider-meta
          --filter=@unisane/framework-ops --output-logs=errors-only
      - run: pnpm --filter @unisane/ops check-types
      - run:
          node --test packages/unisane-ops/test/package-surface.integration.test.mjs
          packages/unisane-ops/test/cli.integration.test.mjs
      - run: node scripts/private-release.mjs prepare
      - run: node scripts/private-release.mjs consumer
      - name: Publish verified restricted archives
        run: node scripts/private-release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-private-canary
          path: .tmp/private-release
          retention-days: 30
