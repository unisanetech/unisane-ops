apiVersion: batch/v1
kind: Job
metadata:
  name: unisane-ops-hosted-rollback-check
  labels:
    app.kubernetes.io/name: unisane-ops-hosted
    app.kubernetes.io/component: rollback-check
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unisane-ops-hosted
        app.kubernetes.io/component: rollback-check
    spec:
      restartPolicy: Never
      serviceAccountName: unisane-ops-hosted
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollback-check
          image: unisane-ops-hosted-runtime
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/bin/probe.js']
          env:
            - name: OPS_HOSTED_POSTGRES_URL_FILE
              value: /run/secrets/database/postgres-url
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: database
              mountPath: /run/secrets/database
              readOnly: true
      volumes:
        - name: database
          secret:
            secretName: unisane-ops-hosted-database-owner
            items:
              - key: postgres-url
                path: postgres-url
