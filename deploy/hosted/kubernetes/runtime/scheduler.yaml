apiVersion: apps/v1
kind: Deployment
metadata:
  name: unisane-ops-hosted-scheduler
  labels:
    app.kubernetes.io/name: unisane-ops-hosted
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unisane-ops-hosted
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unisane-ops-hosted
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: unisane-ops-hosted
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: unisane-ops-hosted-runtime
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/bin/scheduler.js']
          env:
            - name: OPS_HOSTED_ROLE
              value: scheduler
            - name: OPS_HOSTED_SCHEDULER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPS_HOSTED_POSTGRES_URL_FILE
              value: /run/secrets/database/postgres-url
          startupProbe:
            exec:
              command: ['node', 'dist/bin/probe.js']
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ['node', 'dist/bin/probe.js']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: database
              mountPath: /run/secrets/database
              readOnly: true
      volumes:
        - name: database
          secret:
            secretName: unisane-ops-hosted-database-scheduler
            items:
              - key: postgres-url
                path: postgres-url
